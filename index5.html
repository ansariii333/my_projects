<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Winners</title>
    <style>
        body {
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            font-size: 21px;
            background-color: #fff;
        }

        h1 {
            font-size: 90px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-weight: 100;
            color: #000;
            text-shadow: 1px 1px 2px #eee;
            margin: 20px 0 0 40px;
        }

        h2 {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 20px 0 20px 40px;
        }

        .header-box {
            display: flex;
            justify-content: flex-end; /* кнопки справа */
            align-items: center;
            padding: 0 40px;
            gap: 15px;
        }

        .start-button {
            background-color: rgb(101, 225, 113);
            color: aliceblue;
            border-radius: 12px;
            font-size: 16px;
            padding: 10px 25px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            text-shadow: 1px 1px 2px rgb(157, 223, 163);
            transition: transform 0.2s, background-color 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
            background-color: rgb(80, 200, 90);
        }

        .container {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap; /* перенос на узких экранах */
            gap: 20px;
            margin: 0 40px 40px 40px;
        }

        .main-box {
            flex: 1;
            min-width: 200px; /* минимальная ширина для адаптивности */
            text-align: center;
            background-color: rgb(207, 226, 229);
            border-radius: 12px;
            padding: 45px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .map-container {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            margin: 20px 40px 30px 40px;
        }

        .map-container a {
            position: absolute;
            font-size: 12px;
            color: #eee;
        }

        .map-container iframe {
            width: 100%;
            max-width: 700px;
            height: 500px;
            border-radius: 12px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>
        <h1>GreenLoop</h1>
        <div class="header-box">
            <button class="start-button">Записаться</button>
            <button class="start-button">Войти</button>
        </div>
        <h2>«Сортируй отходы — получай бонусы»</h2>
        <h2>Как это работает?</h2>

        <div class="map-container">
            <a href="https://yandex.com/maps?utm_medium=mapframe&utm_source=maps" style="top:0;">Карта</a>
            <a href="https://yandex.com/maps/?ll=10.854186%2C49.182076&utm_medium=mapframe&utm_source=maps&z=4" style="top:14px;">Яндекс Карты — транспорт, навигация, поиск мест</a>
            <iframe src="https://yandex.com/map-widget/v1/?ll=10.854186%2C49.182076&z=4" allowfullscreen></iframe>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="main-box">
                <h3>1000+</h3>
                <p>Пользователей</p>
            </div>
            <div class="main-box">
                <h3>2639 тонн</h3>
                <p>Переработанного мусора</p>
            </div>
            <div class="main-box">
                <h3>500 тонн</h3>
                <p>Собранного отхода</p>
            </div>
        </div>
    </main>
</body>
</html>
